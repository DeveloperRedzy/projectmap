name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; the real values are configured in the
          # hosting provider (e.g. Vercel) environment settings.
          REACT_APP_SUPABASE_URL: 'https://placeholder.supabase.co'
          REACT_APP_SUPABASE_ANON_KEY: 'placeholder-anon-key'
